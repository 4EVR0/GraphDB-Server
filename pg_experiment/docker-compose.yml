services:
  postgres:
    image: postgres:16
    container_name: pg_experiment
    environment:
      POSTGRES_USER: bench_user
      POSTGRES_PASSWORD: bench_pass
      POSTGRES_DB: graphdb_bench
    ports:
      - "5433:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench_user -d graphdb_bench"]
      interval: 5s
      timeout: 5s
      retries: 5
